<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Bandre's Legal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ee;
      color: #1d2433;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      max-width: 640px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 20px 45px rgba(17,24,39,0.12);
      padding: 48px 36px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #f1e3c4;
      color: #7a5b2f;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 16px;
      color: #111827;
      font-size: clamp(2rem, 4vw, 3rem);
    }
    p {
      font-size: 1rem;
      line-height: 1.7;
      color: #4f5869;
    }
    a {
      display: inline-block;
      margin-top: 18px;
      background: linear-gradient(135deg, #d4af75 0%, #b8894d 100%);
      color: #111827;
      padding: 14px 24px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Consultation Request</div>
    <h1>Thank You</h1>
    <p>Your consultation request has been received successfully. A member of our legal team will review your message and get back to you as soon as possible.</p>
    <a href="index.html">Return to Home</a>
  </div>
</body>
</html>
